name: CI

# Гейт на каждый push и pull request. До этого в репозитории не было ни одной
# автоматической проверки: сборка и тесты гонялись руками, поэтому регрессии
# ловились уже на стенде.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

# Push в ветку с открытым PR иначе запускает job дважды. Группа по ref
# оставляет только последний запуск и отменяет предыдущий.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Установить Go
        uses: actions/setup-go@v7
        with:
          # Версия берётся из go.mod, чтобы не разъезжаться с проектом.
          go-version-file: go.mod
          cache: true

      - name: Проверить форматирование
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Файлы не отформатированы gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Собрать
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: Тесты
        # -race ловит гонки по памяти внутри процесса Go. Он НЕ проверяет
        # блокировки и аномалии PostgreSQL: транзакционные правки MoveCard и
        # создания карточки этим гейтом не покрыты, для них нужен
        # интеграционный тест с реальной базой и двумя встречными запросами.
        # Такого теста пока нет — это осознанный пробел, а не забытый шаг.
        run: go test -race ./...
